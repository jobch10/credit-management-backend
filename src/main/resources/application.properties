#Nombre
spring.application.name=credit-management-backend

#POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credit_management}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

#HIBERNATE
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop


spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ZONA HORARIA
spring.jackson.time-zone=America/Lima

#SERVER
server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration-in-ms=86400000

# UPLOADS
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DECOLECTA API (RENIEC)
decolecta.api.base-url=https://api.decolecta.com/v1
decolecta.api.token=${DECOLECTA_TOKEN}
decolecta.api.timeout=5000